apiVersion: v1
kind: Pod
metadata:
  name: ebs-storage-test
  namespace: storage-test
spec:
  containers:
    - name: app
      image: public.ecr.aws/docker/library/busybox:1.36
      command:
        - /bin/sh
        - -c
        - |
          echo "EBS CSI storage test started"
          while true; do
            sleep 3600
          done

      volumeMounts:
        - name: ebs-storage
          mountPath: /data

  volumes:
    - name: ebs-storage
      persistentVolumeClaim:
        claimName: ebs-gp3-test-pvc
