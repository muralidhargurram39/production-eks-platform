{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy

metadata:
  name: {{ include "demo-app.fullname" . }}-network-policy
  labels:
    {{- include "demo-app.labels" . | nindent 4 }}

spec:
  podSelector:
    matchLabels:
      {{- include "demo-app.selectorLabels" . | nindent 6 }}

  policyTypes:
    - Ingress

  ingress:
    - from:
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.ingress.namespaceSelector | nindent 12 }}

      ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.ingress.port }}
{{- end }}
