name: Application CI

on:
  push:
    branches:
      - main
    paths:
      - "application/demo-app/**"
      - "kubernetes/applications/demo-app/**"
      - ".github/workflows/application-ci.yml"

  pull_request:
    branches:
      - main
    paths:
      - "application/demo-app/**"
      - "kubernetes/applications/demo-app/**"
      - ".github/workflows/application-ci.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: application-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: ap-south-2

  ECR_REPOSITORY: demo-app

  EKS_CLUSTER_NAME: production-eks-platform-dev

  K8S_NAMESPACE: dev
  K8S_DEPLOYMENT: demo-app
  K8S_CONTAINER: demo-app
  K8S_SERVICE: demo-app

jobs:

  # ============================================================
  # BUILD
  # ============================================================
  build:
    name: Build Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "BUILDING APPLICATION"
          echo "=========================================="

          IMAGE="demo-app:${GITHUB_SHA}"

          echo "Image:"
          echo "$IMAGE"

          docker build \
            --tag "$IMAGE" \
            application/demo-app

          echo
          echo "Docker build completed successfully."


  # ============================================================
  # PUSH IMAGE TO AMAZON ECR
  # ============================================================
  push:
    name: Push Image to Amazon ECR
    runs-on: ubuntu-latest
    needs: build

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    outputs:
      ecr_registry: ${{ steps.login_ecr.outputs.registry }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::438064565553:role/GitHubActions-ECR-Push-Role
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "AWS IDENTITY"
          echo "=========================================="

          aws sts get-caller-identity

      - name: Login to Amazon ECR
        id: login_ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build image for ECR
        env:
          ECR_REGISTRY: ${{ steps.login_ecr.outputs.registry }}
        run: |
          set -euo pipefail

          IMAGE="${ECR_REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}"

          echo "=========================================="
          echo "BUILDING ECR IMAGE"
          echo "=========================================="

          echo "Image:"
          echo "$IMAGE"

          docker build \
            --tag "$IMAGE" \
            application/demo-app

      - name: Push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login_ecr.outputs.registry }}
        run: |
          set -euo pipefail

          IMAGE="${ECR_REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}"

          echo "=========================================="
          echo "PUSHING IMAGE TO AMAZON ECR"
          echo "=========================================="

          echo "Image:"
          echo "$IMAGE"

          docker push "$IMAGE"

          echo
          echo "IMAGE PUSH SUCCESSFUL"


  # ============================================================
  # DEPLOY TO AMAZON EKS
  # ============================================================
  deploy:
    name: Deploy to Amazon EKS
    runs-on: ubuntu-latest
    needs: push

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    environment:
      name: development

    permissions:
      contents: read
      id-token: write

    env:
      ECR_REGISTRY: ${{ needs.push.outputs.ecr_registry }}

    steps:

      # --------------------------------------------------------
      # SOURCE
      # --------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # AWS AND EKS AUTHENTICATION
      # --------------------------------------------------------
      - name: Configure AWS credentials for EKS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::438064565553:role/GitHubActions-EKS-Deploy-Role
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "AWS IDENTITY"
          echo "=========================================="

          aws sts get-caller-identity

      - name: Configure kubectl
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "CONFIGURING KUBECTL"
          echo "=========================================="

          aws eks update-kubeconfig \
            --name "$EKS_CLUSTER_NAME" \
            --region "$AWS_REGION"

      - name: Verify EKS connectivity
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "VERIFYING EKS CONNECTIVITY"
          echo "=========================================="

          kubectl get deployment \
            "$K8S_DEPLOYMENT" \
            --namespace "$K8S_NAMESPACE"


      # --------------------------------------------------------
      # RECORD CURRENT STATE
      # --------------------------------------------------------
      - name: Record current deployment
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "CURRENT DEPLOYMENT"
          echo "=========================================="

          kubectl rollout history \
            deployment/"$K8S_DEPLOYMENT" \
            --namespace "$K8S_NAMESPACE"

          CURRENT_IMAGE="$(kubectl get deployment \
            "$K8S_DEPLOYMENT" \
            --namespace "$K8S_NAMESPACE" \
            -o jsonpath='{.spec.template.spec.containers[0].image}')"

          if [[ -z "$CURRENT_IMAGE" ]]; then
            echo "ERROR: Unable to determine current deployment image."
            exit 1
          fi

          echo "CURRENT_IMAGE=$CURRENT_IMAGE" >> "$GITHUB_ENV"

          echo
          echo "Current image:"
          echo "$CURRENT_IMAGE"


      # --------------------------------------------------------
      # DEPLOYMENT METADATA
      # --------------------------------------------------------
      - name: Record deployment metadata
        run: |
          set -euo pipefail

          DEPLOYMENT_TIME="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          echo "DEPLOYMENT_TIME=$DEPLOYMENT_TIME" >> "$GITHUB_ENV"

          echo "=========================================="
          echo "DEPLOYMENT METADATA"
          echo "=========================================="

          echo "Git SHA:         $GITHUB_SHA"
          echo "Repository:      $GITHUB_REPOSITORY"
          echo "Run ID:          $GITHUB_RUN_ID"
          echo "Run Number:      $GITHUB_RUN_NUMBER"
          echo "Deployment Time: $DEPLOYMENT_TIME"

      - name: Annotate Kubernetes deployment
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "ANNOTATING DEPLOYMENT"
          echo "=========================================="

          kubectl annotate deployment \
            "$K8S_DEPLOYMENT" \
            --namespace "$K8S_NAMESPACE" \
            "deployment.platform/git-sha=$GITHUB_SHA" \
            "deployment.platform/repository=$GITHUB_REPOSITORY" \
            "deployment.platform/github-run-id=$GITHUB_RUN_ID" \
            "deployment.platform/github-run-number=$GITHUB_RUN_NUMBER" \
            "deployment.platform/deployed-at=$DEPLOYMENT_TIME" \
            --overwrite


      # --------------------------------------------------------
      # DEPLOY NEW VERSION
      # --------------------------------------------------------
      - name: Deploy new application version
        run: |
          set -euo pipefail

          NEW_IMAGE="${ECR_REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}"

          echo "NEW_IMAGE=$NEW_IMAGE" >> "$GITHUB_ENV"

          echo "=========================================="
          echo "DEPLOYING APPLICATION"
          echo "=========================================="

          echo "Application: $K8S_DEPLOYMENT"
          echo "Namespace:   $K8S_NAMESPACE"

          echo
          echo "Previous image:"
          echo "$CURRENT_IMAGE"

          echo
          echo "New image:"
          echo "$NEW_IMAGE"

          kubectl set image \
            deployment/"$K8S_DEPLOYMENT" \
            "$K8S_CONTAINER=$NEW_IMAGE" \
            --namespace "$K8S_NAMESPACE"


      # --------------------------------------------------------
      # WAIT FOR ROLLOUT
      # --------------------------------------------------------
      - name: Wait for rollout
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "WAITING FOR ROLLOUT"
          echo "=========================================="

          kubectl rollout status \
            deployment/"$K8S_DEPLOYMENT" \
            --namespace "$K8S_NAMESPACE" \
            --timeout=5m


      # --------------------------------------------------------
      # VALIDATE DEPLOYMENT HEALTH
      # --------------------------------------------------------
      - name: Validate deployment health
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "DEPLOYMENT HEALTH VALIDATION"
          echo "=========================================="

          DESIRED_REPLICAS="$(kubectl get deployment \
            "$K8S_DEPLOYMENT" \
            --namespace "$K8S_NAMESPACE" \
            -o jsonpath='{.spec.replicas}')"

          READY_REPLICAS="$(kubectl get deployment \
            "$K8S_DEPLOYMENT" \
            --namespace "$K8S_NAMESPACE" \
            -o jsonpath='{.status.readyReplicas}')"

          AVAILABLE_REPLICAS="$(kubectl get deployment \
            "$K8S_DEPLOYMENT" \
            --namespace "$K8S_NAMESPACE" \
            -o jsonpath='{.status.availableReplicas}')"

          DESIRED_REPLICAS="${DESIRED_REPLICAS:-0}"
          READY_REPLICAS="${READY_REPLICAS:-0}"
          AVAILABLE_REPLICAS="${AVAILABLE_REPLICAS:-0}"

          echo "Desired replicas:   $DESIRED_REPLICAS"
          echo "Ready replicas:     $READY_REPLICAS"
          echo "Available replicas: $AVAILABLE_REPLICAS"

          if [[ "$READY_REPLICAS" -ne "$DESIRED_REPLICAS" ]]; then
            echo "ERROR: Not all replicas are ready."
            exit 1
          fi

          if [[ "$AVAILABLE_REPLICAS" -ne "$DESIRED_REPLICAS" ]]; then
            echo "ERROR: Not all replicas are available."
            exit 1
          fi

          echo
          echo "Deployment health validation passed."


      # --------------------------------------------------------
      # VALIDATE PODS
      # --------------------------------------------------------
      - name: Validate application pods
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "POD VALIDATION"
          echo "=========================================="

          PODS="$(kubectl get pods \
            --namespace "$K8S_NAMESPACE" \
            -l app.kubernetes.io/name="$K8S_DEPLOYMENT" \
            -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}')"

          if [[ -z "$PODS" ]]; then
            echo "ERROR: No application pods found."
            exit 1
          fi

          while read -r POD; do
            [[ -z "$POD" ]] && continue

            PHASE="$(kubectl get pod "$POD" \
              --namespace "$K8S_NAMESPACE" \
              -o jsonpath='{.status.phase}')"

            READY="$(kubectl get pod "$POD" \
              --namespace "$K8S_NAMESPACE" \
              -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}')"

            echo
            echo "Checking pod: $POD"
            echo "Phase: $PHASE"
            echo "Ready: $READY"

            if [[ "$PHASE" != "Running" ]]; then
              echo "ERROR: Pod $POD is not Running."
              exit 1
            fi

            if [[ "$READY" != "True" ]]; then
              echo "ERROR: Pod $POD is not Ready."
              exit 1
            fi

          done <<< "$PODS"

          echo
          echo "All application pods are Running and Ready."


      # --------------------------------------------------------
      # VALIDATE DEPLOYED IMAGE
      # --------------------------------------------------------
      - name: Validate deployed image
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "IMAGE VALIDATION"
          echo "=========================================="

          DEPLOYED_IMAGE="$(kubectl get deployment \
            "$K8S_DEPLOYMENT" \
            --namespace "$K8S_NAMESPACE" \
            -o jsonpath='{.spec.template.spec.containers[0].image}')"

          echo "Expected image:"
          echo "$NEW_IMAGE"

          echo
          echo "Deployed image:"
          echo "$DEPLOYED_IMAGE"

          if [[ "$DEPLOYED_IMAGE" != "$NEW_IMAGE" ]]; then
            echo "ERROR: Deployed image does not match expected image."
            exit 1
          fi

          echo
          echo "Image validation passed."


      # --------------------------------------------------------
      # VALIDATE SERVICE ENDPOINTS
      # --------------------------------------------------------
      - name: Validate service endpoints
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "SERVICE ENDPOINT VALIDATION"
          echo "=========================================="

          SERVICE_IPS="$(kubectl get endpoints \
            "$K8S_SERVICE" \
            --namespace "$K8S_NAMESPACE" \
            -o jsonpath='{range .subsets[*].addresses[*]}{.ip}{"\n"}{end}' \
            2>/dev/null || true)"

          ENDPOINT_COUNT="$(printf '%s\n' "$SERVICE_IPS" \
            | sed '/^$/d' \
            | wc -l)"

          echo "Service:"
          echo "$K8S_SERVICE"

          echo
          echo "Ready endpoints:"
          echo "$SERVICE_IPS"

          echo
          echo "Ready endpoint count:"
          echo "$ENDPOINT_COUNT"

          if [[ "$ENDPOINT_COUNT" -lt 1 ]]; then
            echo "ERROR: No ready service endpoints found."
            exit 1
          fi

          echo
          echo "Service endpoint validation passed."


      # --------------------------------------------------------
      # APPLICATION HTTP HEALTH CHECK
      # --------------------------------------------------------
      - name: Application HTTP health check
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "APPLICATION HTTP HEALTH CHECK"
          echo "=========================================="

          HEALTHCHECK_POD="healthcheck-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          echo "Creating temporary health check pod:"
          echo "$HEALTHCHECK_POD"

          kubectl run "$HEALTHCHECK_POD" \
            --namespace "$K8S_NAMESPACE" \
            --image=curlimages/curl:8.10.1 \
            --restart=Never \
            --command -- \
            sh -c \
            "curl --fail --silent --show-error --max-time 10 http://${K8S_SERVICE}.${K8S_NAMESPACE}.svc.cluster.local/"

          echo
          echo "Waiting for health check pod..."

          kubectl wait \
            --namespace "$K8S_NAMESPACE" \
            --for=jsonpath='{.status.phase}'=Succeeded \
            "pod/$HEALTHCHECK_POD" \
            --timeout=60s

          echo
          echo "Application HTTP health check passed."

          echo
          echo "Cleaning up health check pod..."

          kubectl delete pod \
            "$HEALTHCHECK_POD" \
            --namespace "$K8S_NAMESPACE" \
            --ignore-not-found


      # --------------------------------------------------------
      # FAILURE DIAGNOSTICS
      # --------------------------------------------------------
      - name: Collect diagnostics on failure
        if: failure()
        run: |
          echo "=========================================="
          echo "DEPLOYMENT FAILURE DIAGNOSTICS"
          echo "=========================================="

          echo
          echo "========== DEPLOYMENT =========="

          kubectl get deployment \
            "$K8S_DEPLOYMENT" \
            --namespace "$K8S_NAMESPACE" \
            -o wide || true

          echo
          echo "========== PODS =========="

          kubectl get pods \
            --namespace "$K8S_NAMESPACE" \
            -l app.kubernetes.io/name="$K8S_DEPLOYMENT" \
            -o wide || true

          echo
          echo "========== DEPLOYMENT DESCRIPTION =========="

          kubectl describe deployment \
            "$K8S_DEPLOYMENT" \
            --namespace "$K8S_NAMESPACE" || true

          echo
          echo "========== POD EVENTS =========="

          kubectl get events \
            --namespace "$K8S_NAMESPACE" \
            --sort-by='.lastTimestamp' || true


      # --------------------------------------------------------
      # AUTOMATIC ROLLBACK
      # --------------------------------------------------------
      - name: Rollback on deployment failure
        if: failure()
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "DEPLOYMENT FAILED"
          echo "STARTING AUTOMATIC ROLLBACK"
          echo "=========================================="

          echo
          echo "Failed image:"
          echo "${NEW_IMAGE:-unknown}"

          echo
          echo "Restoring previous image:"
          echo "$CURRENT_IMAGE"

          kubectl set image \
            deployment/"$K8S_DEPLOYMENT" \
            "$K8S_CONTAINER=$CURRENT_IMAGE" \
            --namespace "$K8S_NAMESPACE"

          echo
          echo "=========================================="
          echo "WAITING FOR ROLLBACK"
          echo "=========================================="

          kubectl rollout status \
            deployment/"$K8S_DEPLOYMENT" \
            --namespace "$K8S_NAMESPACE" \
            --timeout=5m

          echo
          echo "=========================================="
          echo "ROLLBACK VALIDATION"
          echo "=========================================="

          ROLLBACK_IMAGE="$(kubectl get deployment \
            "$K8S_DEPLOYMENT" \
            --namespace "$K8S_NAMESPACE" \
            -o jsonpath='{.spec.template.spec.containers[0].image}')"

          echo "Expected image:"
          echo "$CURRENT_IMAGE"

          echo
          echo "Restored image:"
          echo "$ROLLBACK_IMAGE"

          if [[ "$ROLLBACK_IMAGE" != "$CURRENT_IMAGE" ]]; then
            echo "ERROR: Rollback did not restore the expected image."
            exit 1
          fi

          DESIRED_REPLICAS="$(kubectl get deployment \
            "$K8S_DEPLOYMENT" \
            --namespace "$K8S_NAMESPACE" \
            -o jsonpath='{.spec.replicas}')"

          READY_REPLICAS="$(kubectl get deployment \
            "$K8S_DEPLOYMENT" \
            --namespace "$K8S_NAMESPACE" \
            -o jsonpath='{.status.readyReplicas}')"

          AVAILABLE_REPLICAS="$(kubectl get deployment \
            "$K8S_DEPLOYMENT" \
            --namespace "$K8S_NAMESPACE" \
            -o jsonpath='{.status.availableReplicas}')"

          DESIRED_REPLICAS="${DESIRED_REPLICAS:-0}"
          READY_REPLICAS="${READY_REPLICAS:-0}"
          AVAILABLE_REPLICAS="${AVAILABLE_REPLICAS:-0}"

          echo
          echo "Desired replicas:   $DESIRED_REPLICAS"
          echo "Ready replicas:     $READY_REPLICAS"
          echo "Available replicas: $AVAILABLE_REPLICAS"

          if [[ "$READY_REPLICAS" -ne "$DESIRED_REPLICAS" ]]; then
            echo "ERROR: Rollback did not restore all ready replicas."
            exit 1
          fi

          if [[ "$AVAILABLE_REPLICAS" -ne "$DESIRED_REPLICAS" ]]; then
            echo "ERROR: Rollback did not restore all available replicas."
            exit 1
          fi

          echo
          echo "=========================================="
          echo "ROLLBACK SUCCESSFUL"
          echo "=========================================="
