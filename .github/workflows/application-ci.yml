name: Application CI

on:
  push:
    branches:
      - main
    paths:
      - "application/demo-app/**"
      - "kubernetes/applications/demo-app/**"
      - ".github/workflows/application-ci.yml"

  pull_request:
    branches:
      - main
    paths:
      - "application/demo-app/**"
      - "kubernetes/applications/demo-app/**"
      - ".github/workflows/application-ci.yml"

# Never allow two deployment workflows for the same Git ref
# to modify the same Kubernetes deployment at the same time.
concurrency:
  group: application-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-south-2

  ECR_REPOSITORY: demo-app
  EKS_CLUSTER_NAME: production-eks-platform-dev

  K8S_NAMESPACE: dev
  K8S_DEPLOYMENT: demo-app
  K8S_CONTAINER: demo-app
  K8S_SERVICE: demo-app

  ROLLOUT_TIMEOUT: 5m
  HEALTHCHECK_TIMEOUT: 60s


# ==============================================================
# BUILD
# ==============================================================
jobs:
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "BUILDING APPLICATION"
          echo "=========================================="

          docker build \
            -t "demo-app:${GITHUB_SHA}" \
            application/demo-app


  # ==============================================================
  # PUSH TO AMAZON ECR
  # ==============================================================
  push:
    name: Push Docker Image to ECR
    runs-on: ubuntu-latest
    needs: build

    # Only main branch pushes are deployable.
    # Pull requests build the application but do not push or deploy.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    outputs:
      ecr_registry: ${{ steps.login_ecr.outputs.registry }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::438064565553:role/GitHubActions-ECR-Push-Role
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "AWS IDENTITY - ECR ROLE"
          echo "=========================================="

          aws sts get-caller-identity

      - name: Login to Amazon ECR
        id: login_ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build image for ECR
        env:
          ECR_REGISTRY: ${{ steps.login_ecr.outputs.registry }}
        run: |
          set -euo pipefail

          IMAGE="${ECR_REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}"

          echo "=========================================="
          echo "BUILDING ECR IMAGE"
          echo "=========================================="

          echo "Image:"
          echo "$IMAGE"

          docker build \
            -t "$IMAGE" \
            application/demo-app

      - name: Push image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login_ecr.outputs.registry }}
        run: |
          set -euo pipefail

          IMAGE="${ECR_REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}"

          echo "=========================================="
          echo "PUSHING IMAGE TO ECR"
          echo "=========================================="

          docker push "$IMAGE"

          echo
          echo "IMAGE PUSHED SUCCESSFULLY"
          echo "$IMAGE"


  # ==============================================================
  # DEPLOY TO AMAZON EKS
  # ==============================================================
  deploy:
    name: Deploy to Amazon EKS
    runs-on: ubuntu-latest
    needs: push

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    environment:
      name: development

    permissions:
      contents: read
      id-token: write

    env:
      ECR_REGISTRY: ${{ needs.push.outputs.ecr_registry }}

    steps:
      # ------------------------------------------------------------
      # CHECKOUT
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4


      # ------------------------------------------------------------
      # AWS / KUBECTL
      # ------------------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::438064565553:role/GitHubActions-EKS-Deploy-Role
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure kubectl
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "CONFIGURING KUBECTL"
          echo "=========================================="

          aws eks update-kubeconfig \
            --name "$EKS_CLUSTER_NAME" \
            --region "$AWS_REGION"

      - name: Verify EKS connectivity
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "EKS CONNECTIVITY"
          echo "=========================================="

          kubectl get deployment \
            "$K8S_DEPLOYMENT" \
            --namespace "$K8S_NAMESPACE"


      # ------------------------------------------------------------
      # RECORD KNOWN-GOOD DEPLOYMENT
      # ------------------------------------------------------------
      - name: Record current deployment
        id: current_deployment
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "RECORDING CURRENT DEPLOYMENT"
          echo "=========================================="

          CURRENT_IMAGE="$(kubectl get deployment \
            "$K8S_DEPLOYMENT" \
            --namespace "$K8S_NAMESPACE" \
            -o jsonpath='{.spec.template.spec.containers[0].image}')"

          CURRENT_REVISION="$(kubectl get deployment \
            "$K8S_DEPLOYMENT" \
            --namespace "$K8S_NAMESPACE" \
            -o jsonpath='{.metadata.annotations.deployment\.kubernetes\.io/revision}')"

          CURRENT_REPLICAS="$(kubectl get deployment \
            "$K8S_DEPLOYMENT" \
            --namespace "$K8S_NAMESPACE" \
            -o jsonpath='{.spec.replicas}')"

          if [[ -z "$CURRENT_IMAGE" ]]; then
            echo "ERROR: Could not determine current deployment image."
            exit 1
          fi

          if [[ -z "$CURRENT_REPLICAS" ]]; then
            echo "ERROR: Could not determine desired replica count."
            exit 1
          fi

          echo "CURRENT_IMAGE=$CURRENT_IMAGE" >> "$GITHUB_ENV"
          echo "CURRENT_REVISION=${CURRENT_REVISION:-unknown}" >> "$GITHUB_ENV"
          echo "CURRENT_REPLICAS=$CURRENT_REPLICAS" >> "$GITHUB_ENV"

          echo
          echo "Current image:"
          echo "$CURRENT_IMAGE"

          echo
          echo "Current revision:"
          echo "${CURRENT_REVISION:-unknown}"

          echo
          echo "Current desired replicas:"
          echo "$CURRENT_REPLICAS"

          echo
          echo "Rollout history:"
          kubectl rollout history \
            deployment/"$K8S_DEPLOYMENT" \
            --namespace "$K8S_NAMESPACE"


      # ------------------------------------------------------------
      # DEPLOYMENT METADATA
      # ------------------------------------------------------------
      - name: Set deployment metadata
        run: |
          set -euo pipefail

          DEPLOYMENT_TIME="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          echo "DEPLOYMENT_TIME=$DEPLOYMENT_TIME" >> "$GITHUB_ENV"

          echo "=========================================="
          echo "DEPLOYMENT METADATA"
          echo "=========================================="

          echo "Git SHA:         $GITHUB_SHA"
          echo "Repository:      $GITHUB_REPOSITORY"
          echo "Run ID:          $GITHUB_RUN_ID"
          echo "Run Number:      $GITHUB_RUN_NUMBER"
          echo "Deployment Time: $DEPLOYMENT_TIME"


      # ------------------------------------------------------------
      # DEPLOY NEW IMAGE
      # ------------------------------------------------------------
      - name: Deploy new application version
        run: |
          set -euo pipefail

          NEW_IMAGE="${ECR_REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}"

          echo "NEW_IMAGE=$NEW_IMAGE" >> "$GITHUB_ENV"

          echo "=========================================="
          echo "DEPLOYING APPLICATION"
          echo "=========================================="

          echo "Application: $K8S_DEPLOYMENT"
          echo "Namespace:   $K8S_NAMESPACE"
          echo "New image:   $NEW_IMAGE"

          kubectl set image \
            deployment/"$K8S_DEPLOYMENT" \
            "$K8S_CONTAINER=$NEW_IMAGE" \
            --namespace "$K8S_NAMESPACE"

          echo
          echo "Application image updated."


      # ------------------------------------------------------------
      # ROLLOUT
      #
      # continue-on-error is intentional.
      # We must allow the workflow to reach automatic rollback.
      # ------------------------------------------------------------
      - name: Wait for rollout
        id: rollout
        continue-on-error: true
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "WAITING FOR ROLLOUT"
          echo "=========================================="

          kubectl rollout status \
            deployment/"$K8S_DEPLOYMENT" \
            --namespace "$K8S_NAMESPACE" \
            --timeout="$ROLLOUT_TIMEOUT"


      # ------------------------------------------------------------
      # DEPLOYMENT HEALTH
      # ------------------------------------------------------------
      - name: Validate deployment health
        id: deployment_health
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "DEPLOYMENT HEALTH VALIDATION"
          echo "=========================================="

          DESIRED_REPLICAS="$(kubectl get deployment \
            "$K8S_DEPLOYMENT" \
            --namespace "$K8S_NAMESPACE" \
            -o jsonpath='{.spec.replicas}')"

          READY_REPLICAS="$(kubectl get deployment \
            "$K8S_DEPLOYMENT" \
            --namespace "$K8S_NAMESPACE" \
            -o jsonpath='{.status.readyReplicas}')"

          AVAILABLE_REPLICAS="$(kubectl get deployment \
            "$K8S_DEPLOYMENT" \
            --namespace "$K8S_NAMESPACE" \
            -o jsonpath='{.status.availableReplicas}')"

          DESIRED_REPLICAS="${DESIRED_REPLICAS:-0}"
          READY_REPLICAS="${READY_REPLICAS:-0}"
          AVAILABLE_REPLICAS="${AVAILABLE_REPLICAS:-0}"

          echo "Desired replicas:   $DESIRED_REPLICAS"
          echo "Ready replicas:     $READY_REPLICAS"
          echo "Available replicas: $AVAILABLE_REPLICAS"

          if [[ "$READY_REPLICAS" -ne "$DESIRED_REPLICAS" ]]; then
            echo
            echo "ERROR: Ready replicas do not match desired replicas."
            exit 1
          fi

          if [[ "$AVAILABLE_REPLICAS" -ne "$DESIRED_REPLICAS" ]]; then
            echo
            echo "ERROR: Available replicas do not match desired replicas."
            exit 1
          fi

          echo
          echo "Deployment health validation passed."


      # ------------------------------------------------------------
      # POD HEALTH
      # ------------------------------------------------------------
      - name: Validate application pods
        id: pod_health
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "POD VALIDATION"
          echo "=========================================="

          PODS="$(kubectl get pods \
            --namespace "$K8S_NAMESPACE" \
            -l app.kubernetes.io/name="$K8S_DEPLOYMENT" \
            -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}')"

          if [[ -z "$PODS" ]]; then
            echo "ERROR: No application pods found."
            exit 1
          fi

          FAILED=0

          while IFS= read -r POD; do
            [[ -z "$POD" ]] && continue

            PHASE="$(kubectl get pod \
              "$POD" \
              --namespace "$K8S_NAMESPACE" \
              -o jsonpath='{.status.phase}')"

            READY="$(kubectl get pod \
              "$POD" \
              --namespace "$K8S_NAMESPACE" \
              -o jsonpath='{range .status.conditions[?(@.type=="Ready")]}{.status}{end}')"

            echo
            echo "Checking pod: $POD"
            echo "Phase: $PHASE"
            echo "Ready: $READY"

            if [[ "$PHASE" != "Running" || "$READY" != "True" ]]; then
              FAILED=1
            fi
          done <<< "$PODS"

          if [[ "$FAILED" -ne 0 ]]; then
            echo
            echo "ERROR: One or more application pods are unhealthy."
            exit 1
          fi

          echo
          echo "All application pods are Running and Ready."


      # ------------------------------------------------------------
      # IMAGE VALIDATION
      # ------------------------------------------------------------
      - name: Validate deployed image
        id: image_health
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail

          EXPECTED_IMAGE="${ECR_REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}"

          echo "=========================================="
          echo "IMAGE VALIDATION"
          echo "=========================================="

          DEPLOYED_IMAGE="$(kubectl get deployment \
            "$K8S_DEPLOYMENT" \
            --namespace "$K8S_NAMESPACE" \
            -o jsonpath='{.spec.template.spec.containers[0].image}')"

          echo "Expected image:"
          echo "$EXPECTED_IMAGE"

          echo
          echo "Deployed image:"
          echo "$DEPLOYED_IMAGE"

          if [[ "$DEPLOYED_IMAGE" != "$EXPECTED_IMAGE" ]]; then
            echo
            echo "ERROR: Deployment is using the wrong image."
            exit 1
          fi

          echo
          echo "Image validation passed."


      # ------------------------------------------------------------
      # SERVICE ENDPOINT VALIDATION
      # ------------------------------------------------------------
      - name: Validate service endpoints
        id: endpoint_health
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "SERVICE ENDPOINT VALIDATION"
          echo "=========================================="

          ENDPOINTS="$(kubectl get endpointslice \
            --namespace "$K8S_NAMESPACE" \
            -l "kubernetes.io/service-name=$K8S_SERVICE" \
            -o jsonpath='{range .items[*].endpoints[?(@.conditions.ready==true)]}{range .addresses[*]}{.}{"\n"}{end}{end}')"

          ENDPOINT_COUNT="$(printf '%s\n' "$ENDPOINTS" | sed '/^$/d' | wc -l | tr -d ' ')"

          echo "Service:"
          echo "$K8S_SERVICE"

          echo
          echo "Ready endpoints:"

          if [[ -n "$ENDPOINTS" ]]; then
            printf '%s\n' "$ENDPOINTS"
          else
            echo "NONE"
          fi

          echo
          echo "Ready endpoint count:"
          echo "$ENDPOINT_COUNT"

          if [[ "$ENDPOINT_COUNT" -lt 1 ]]; then
            echo
            echo "ERROR: No ready service endpoints found."
            exit 1
          fi

          echo
          echo "Service endpoint validation passed."


      # ------------------------------------------------------------
      # APPLICATION HTTP HEALTH CHECK
      # ------------------------------------------------------------
      - name: Application HTTP health check
        id: http_health
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "APPLICATION HTTP HEALTH CHECK"
          echo "=========================================="

          HEALTHCHECK_POD="healthcheck-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          cleanup() {
            kubectl delete pod \
              "$HEALTHCHECK_POD" \
              --namespace "$K8S_NAMESPACE" \
              --ignore-not-found \
              >/dev/null 2>&1 || true
          }

          trap cleanup EXIT

          echo "Creating temporary health check pod:"
          echo "$HEALTHCHECK_POD"

          kubectl run "$HEALTHCHECK_POD" \
            --namespace "$K8S_NAMESPACE" \
            --image=curlimages/curl:8.10.1 \
            --restart=Never \
            --command -- \
            sh -c \
            "curl --fail --silent --show-error --max-time 10 http://${K8S_SERVICE}.${K8S_NAMESPACE}.svc.cluster.local/"

          echo
          echo "Waiting for health check pod..."

          kubectl wait \
            --namespace "$K8S_NAMESPACE" \
            --for=jsonpath='{.status.phase}'=Succeeded \
            "pod/$HEALTHCHECK_POD" \
            --timeout="$HEALTHCHECK_TIMEOUT"

          echo
          echo "Application HTTP health check passed."


      # ------------------------------------------------------------
      # SUCCESS
      #
      # This step runs only when every deployment validation passed.
      # ------------------------------------------------------------
      - name: Deployment successful
        if: steps.rollout.outcome == 'success' && steps.deployment_health.outcome == 'success' && steps.pod_health.outcome == 'success' && steps.image_health.outcome == 'success' && steps.endpoint_health.outcome == 'success' && steps.http_health.outcome == 'success'
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "RECORDING SUCCESSFUL DEPLOYMENT"
          echo "=========================================="

          kubectl annotate deployment \
            "$K8S_DEPLOYMENT" \
            --namespace "$K8S_NAMESPACE" \
            "deployment.platform/git-sha=$GITHUB_SHA" \
            "deployment.platform/repository=$GITHUB_REPOSITORY" \
            "deployment.platform/github-run-id=$GITHUB_RUN_ID" \
            "deployment.platform/github-run-number=$GITHUB_RUN_NUMBER" \
            "deployment.platform/deployed-at=$DEPLOYMENT_TIME" \
            --overwrite

          echo
          echo "=========================================="
          echo "DEPLOYMENT SUCCESSFUL"
          echo "=========================================="

          echo "Application: $K8S_DEPLOYMENT"
          echo "Namespace:   $K8S_NAMESPACE"
          echo "Git SHA:     $GITHUB_SHA"
          echo "Deployed image:"
          echo "$NEW_IMAGE"

          echo
          echo "=========================================="
          echo "DEPLOYMENT STATUS"
          echo "=========================================="

          kubectl get deployment \
            "$K8S_DEPLOYMENT" \
            --namespace "$K8S_NAMESPACE"

          echo
          echo "=========================================="
          echo "RUNNING PODS"
          echo "=========================================="

          kubectl get pods \
            --namespace "$K8S_NAMESPACE" \
            -l app.kubernetes.io/name="$K8S_DEPLOYMENT" \
            -o wide

          echo
          echo "=========================================="
          echo "SERVICE"
          echo "=========================================="

          kubectl get service \
            "$K8S_SERVICE" \
            --namespace "$K8S_NAMESPACE"


      # ------------------------------------------------------------
      # FAILURE DIAGNOSTICS
      #
      # Always collect diagnostics when any deployment validation
      # failed. This step does not perform rollback.
      # ------------------------------------------------------------
      - name: Collect deployment diagnostics
        if: steps.rollout.outcome != 'success' || steps.deployment_health.outcome != 'success' || steps.pod_health.outcome != 'success' || steps.image_health.outcome != 'success' || steps.endpoint_health.outcome != 'success' || steps.http_health.outcome != 'success'
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "DEPLOYMENT DIAGNOSTICS"
          echo "=========================================="

          echo
          echo "===== DEPLOYMENT ====="

          kubectl describe deployment \
            "$K8S_DEPLOYMENT" \
            --namespace "$K8S_NAMESPACE" || true

          echo
          echo "===== REPLICASETS ====="

          kubectl get replicasets \
            --namespace "$K8S_NAMESPACE" \
            -l app.kubernetes.io/name="$K8S_DEPLOYMENT" \
            -o wide || true

          echo
          echo "===== PODS ====="

          kubectl get pods \
            --namespace "$K8S_NAMESPACE" \
            -l app.kubernetes.io/name="$K8S_DEPLOYMENT" \
            -o wide || true

          echo
          echo "===== POD DESCRIPTIONS ====="

          kubectl describe pods \
            --namespace "$K8S_NAMESPACE" \
            -l app.kubernetes.io/name="$K8S_DEPLOYMENT" || true

          echo
          echo "===== POD LOGS ====="

          kubectl logs \
            --namespace "$K8S_NAMESPACE" \
            -l app.kubernetes.io/name="$K8S_DEPLOYMENT" \
            --all-containers=true \
            --tail=100 \
            --prefix || true

          echo
          echo "===== SERVICE ====="

          kubectl describe service \
            "$K8S_SERVICE" \
            --namespace "$K8S_NAMESPACE" || true

          echo
          echo "===== ENDPOINT SLICES ====="

          kubectl get endpointslice \
            --namespace "$K8S_NAMESPACE" \
            -l "kubernetes.io/service-name=$K8S_SERVICE" \
            -o wide || true


      # ------------------------------------------------------------
      # AUTOMATIC ROLLBACK
      #
      # Runs when the new release fails any validation.
      #
      # IMPORTANT:
      # The rollback itself is allowed to succeed, but this job
      # intentionally exits with code 1 so the bad release remains
      # FAILED in GitHub Actions.
      # ------------------------------------------------------------
      - name: Rollback failed deployment
        if: steps.rollout.outcome != 'success' || steps.deployment_health.outcome != 'success' || steps.pod_health.outcome != 'success' || steps.image_health.outcome != 'success' || steps.endpoint_health.outcome != 'success' || steps.http_health.outcome != 'success'
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "DEPLOYMENT FAILED"
          echo "STARTING AUTOMATIC ROLLBACK"
          echo "=========================================="

          echo
          echo "Failed image:"
          echo "$NEW_IMAGE"

          echo
          echo "Known-good image:"
          echo "$CURRENT_IMAGE"

          echo
          echo "=========================================="
          echo "RESTORING PREVIOUS IMAGE"
          echo "=========================================="

          kubectl set image \
            deployment/"$K8S_DEPLOYMENT" \
            "$K8S_CONTAINER=$CURRENT_IMAGE" \
            --namespace "$K8S_NAMESPACE"

          echo
          echo "Previous image applied."

          echo
          echo "=========================================="
          echo "WAITING FOR ROLLBACK"
          echo "=========================================="

          if ! kubectl rollout status \
            deployment/"$K8S_DEPLOYMENT" \
            --namespace "$K8S_NAMESPACE" \
            --timeout="$ROLLOUT_TIMEOUT"; then

            echo
            echo "=========================================="
            echo "CRITICAL: ROLLBACK FAILED"
            echo "=========================================="

            echo
            echo "===== DEPLOYMENT ====="

            kubectl get deployment \
              "$K8S_DEPLOYMENT" \
              --namespace "$K8S_NAMESPACE" \
              -o wide || true

            echo
            echo "===== PODS ====="

            kubectl get pods \
              --namespace "$K8S_NAMESPACE" \
              -l app.kubernetes.io/name="$K8S_DEPLOYMENT" \
              -o wide || true

            echo
            echo "===== POD LOGS ====="

            kubectl logs \
              --namespace "$K8S_NAMESPACE" \
              -l app.kubernetes.io/name="$K8S_DEPLOYMENT" \
              --all-containers=true \
              --tail=100 \
              --prefix || true

            exit 1
          fi

          # ----------------------------------------------------------
          # ROLLBACK IMAGE VALIDATION
          # ----------------------------------------------------------
          ROLLBACK_IMAGE="$(kubectl get deployment \
            "$K8S_DEPLOYMENT" \
            --namespace "$K8S_NAMESPACE" \
            -o jsonpath='{.spec.template.spec.containers[0].image}')"

          DESIRED_REPLICAS="$(kubectl get deployment \
            "$K8S_DEPLOYMENT" \
            --namespace "$K8S_NAMESPACE" \
            -o jsonpath='{.spec.replicas}')"

          READY_REPLICAS="$(kubectl get deployment \
            "$K8S_DEPLOYMENT" \
            --namespace "$K8S_NAMESPACE" \
            -o jsonpath='{.status.readyReplicas}')"

          AVAILABLE_REPLICAS="$(kubectl get deployment \
            "$K8S_DEPLOYMENT" \
            --namespace "$K8S_NAMESPACE" \
            -o jsonpath='{.status.availableReplicas}')"

          DESIRED_REPLICAS="${DESIRED_REPLICAS:-0}"
          READY_REPLICAS="${READY_REPLICAS:-0}"
          AVAILABLE_REPLICAS="${AVAILABLE_REPLICAS:-0}"

          echo
          echo "=========================================="
          echo "ROLLBACK VALIDATION"
          echo "=========================================="

          echo "Expected image:"
          echo "$CURRENT_IMAGE"

          echo
          echo "Restored image:"
          echo "$ROLLBACK_IMAGE"

          echo
          echo "Desired replicas:   $DESIRED_REPLICAS"
          echo "Ready replicas:     $READY_REPLICAS"
          echo "Available replicas: $AVAILABLE_REPLICAS"

          if [[ "$ROLLBACK_IMAGE" != "$CURRENT_IMAGE" ]]; then
            echo
            echo "CRITICAL: Rollback restored the wrong image."
            exit 1
          fi

          if [[ "$READY_REPLICAS" -ne "$DESIRED_REPLICAS" ]]; then
            echo
            echo "CRITICAL: Rollback did not restore all ready replicas."
            exit 1
          fi

          if [[ "$AVAILABLE_REPLICAS" -ne "$DESIRED_REPLICAS" ]]; then
            echo
            echo "CRITICAL: Rollback did not restore all available replicas."
            exit 1
          fi

          echo
          echo "Rollback image and replica validation passed."


          # ----------------------------------------------------------
          # POST-ROLLBACK SERVICE ENDPOINT VALIDATION
          # ----------------------------------------------------------
          echo
          echo "=========================================="
          echo "POST-ROLLBACK ENDPOINT VALIDATION"
          echo "=========================================="

          ROLLBACK_ENDPOINTS=""
          ROLLBACK_ENDPOINT_COUNT=0

          ENDPOINT_RETRY_ATTEMPTS=30
          ENDPOINT_RETRY_INTERVAL=2

          echo "Waiting for ready Service endpoints..."
          echo "Maximum wait: $((ENDPOINT_RETRY_ATTEMPTS * ENDPOINT_RETRY_INTERVAL)) seconds"

          for attempt in $(seq 1 "$ENDPOINT_RETRY_ATTEMPTS"); do

            ROLLBACK_ENDPOINTS="$(kubectl get endpointslice \
              --namespace "$K8S_NAMESPACE" \
              -l "kubernetes.io/service-name=$K8S_SERVICE" \
              -o jsonpath='{range .items[*].endpoints[?(@.conditions.ready==true)]}{range .addresses[*]}{.}{"\n"}{end}{end}' \
              2>/dev/null || true)"

            ROLLBACK_ENDPOINT_COUNT="$(
              printf '%s\n' "$ROLLBACK_ENDPOINTS" |
              sed '/^$/d' |
              sort -u |
              wc -l |
              tr -d ' '
            )"

            echo "Attempt $attempt/$ENDPOINT_RETRY_ATTEMPTS - Ready endpoints: $ROLLBACK_ENDPOINT_COUNT"

            if [[ "$ROLLBACK_ENDPOINT_COUNT" -ge 1 ]]; then
              break
            fi

            if [[ "$attempt" -lt "$ENDPOINT_RETRY_ATTEMPTS" ]]; then
              sleep "$ENDPOINT_RETRY_INTERVAL"
            fi
          done

          echo
          echo "Ready endpoint count:"
          echo "$ROLLBACK_ENDPOINT_COUNT"

          if [[ "$ROLLBACK_ENDPOINT_COUNT" -lt 1 ]]; then
            echo
            echo "CRITICAL: No ready service endpoints after rollback."

            echo
            echo "===== ENDPOINT SLICES ====="

            kubectl get endpointslice \
              --namespace "$K8S_NAMESPACE" \
              -l "kubernetes.io/service-name=$K8S_SERVICE" \
              -o wide || true

            echo
            echo "===== SERVICE ====="

            kubectl describe service \
              "$K8S_SERVICE" \
              --namespace "$K8S_NAMESPACE" || true

            exit 1
          fi

          echo
          echo "Ready endpoints:"
          echo "$ROLLBACK_ENDPOINTS"

          echo
          echo "Post-rollback endpoint validation passed."



          # ----------------------------------------------------------
          # POST-ROLLBACK HTTP HEALTH CHECK
          # ----------------------------------------------------------
          echo
          echo "=========================================="
          echo "POST-ROLLBACK HTTP HEALTH CHECK"
          echo "=========================================="

          ROLLBACK_HEALTHCHECK_POD="rollback-healthcheck-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          cleanup_rollback_healthcheck() {
            kubectl delete pod \
              "$ROLLBACK_HEALTHCHECK_POD" \
              --namespace "$K8S_NAMESPACE" \
              --ignore-not-found \
              >/dev/null 2>&1 || true
          }

          trap cleanup_rollback_healthcheck EXIT

          echo "Creating temporary rollback health check pod:"
          echo "$ROLLBACK_HEALTHCHECK_POD"

          kubectl run "$ROLLBACK_HEALTHCHECK_POD" \
            --namespace "$K8S_NAMESPACE" \
            --image=curlimages/curl:8.10.1 \
            --restart=Never \
            --command -- \
            sh -c \
            "curl --fail --silent --show-error --max-time 10 http://${K8S_SERVICE}.${K8S_NAMESPACE}.svc.cluster.local/"

          echo
          echo "Waiting for rollback health check pod..."

          if ! kubectl wait \
            --namespace "$K8S_NAMESPACE" \
            --for=jsonpath='{.status.phase}'=Succeeded \
            "pod/$ROLLBACK_HEALTHCHECK_POD" \
            --timeout="$HEALTHCHECK_TIMEOUT"; then

            echo
            echo "=========================================="
            echo "CRITICAL: POST-ROLLBACK HTTP HEALTH FAILED"
            echo "=========================================="

            echo
            echo "===== HEALTH CHECK POD ====="

            kubectl get pod \
              "$ROLLBACK_HEALTHCHECK_POD" \
              --namespace "$K8S_NAMESPACE" \
              -o wide || true

            echo
            echo "===== HEALTH CHECK LOGS ====="

            kubectl logs \
              "$ROLLBACK_HEALTHCHECK_POD" \
              --namespace "$K8S_NAMESPACE" || true

            echo
            echo "===== DEPLOYMENT ====="

            kubectl get deployment \
              "$K8S_DEPLOYMENT" \
              --namespace "$K8S_NAMESPACE" \
              -o wide || true

            echo
            echo "===== PODS ====="

            kubectl get pods \
              --namespace "$K8S_NAMESPACE" \
              -l app.kubernetes.io/name="$K8S_DEPLOYMENT" \
              -o wide || true

            exit 1
          fi

          echo
          echo "Post-rollback HTTP health check passed."

          echo
          echo "=========================================="
          echo "ROLLBACK SUCCESSFUL"
          echo "=========================================="

          echo "Failed image:"
          echo "$NEW_IMAGE"

          echo
          echo "Restored image:"
          echo "$CURRENT_IMAGE"

          echo
          echo "Ready replicas:"
          echo "$READY_REPLICAS/$DESIRED_REPLICAS"

          echo
          echo "Available replicas:"
          echo "$AVAILABLE_REPLICAS/$DESIRED_REPLICAS"

          echo
          echo "Ready service endpoints:"
          echo "$ROLLBACK_ENDPOINT_COUNT"

          echo
          echo "Post-rollback HTTP health:"
          echo "PASSED"

          {
            echo "## Deployment Failed — Rollback Successful"
            echo
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Application | $K8S_DEPLOYMENT |"
            echo "| Namespace | $K8S_NAMESPACE |"
            echo "| Failed Git SHA | $GITHUB_SHA |"
            echo "| Failed Image | $NEW_IMAGE |"
            echo "| Restored Image | $CURRENT_IMAGE |"
            echo "| Ready Replicas | $READY_REPLICAS/$DESIRED_REPLICAS |"
            echo "| Available Replicas | $AVAILABLE_REPLICAS/$DESIRED_REPLICAS |"
            echo "| Ready Service Endpoints | $ROLLBACK_ENDPOINT_COUNT |"
            echo "| Post-Rollback HTTP Health | PASSED |"
          } >> "$GITHUB_STEP_SUMMARY"

          echo
          echo "The Kubernetes application has been restored."
          echo "Rollback was verified through:"
          echo "  - image validation"
          echo "  - replica validation"
          echo "  - EndpointSlice validation"
          echo "  - application HTTP validation"
          echo
          echo "The deployment workflow will remain FAILED intentionally."

          exit 1
