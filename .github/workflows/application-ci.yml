name: Application CI

on:
  push:
    branches:
      - main
    paths:
      - "application/demo-app/**"
      - "kubernetes/applications/demo-app/**"
      - ".github/workflows/application-ci.yml"

  pull_request:
    branches:
      - main
    paths:
      - "application/demo-app/**"
      - "kubernetes/applications/demo-app/**"
      - ".github/workflows/application-ci.yml"

permissions:
  contents: read
  id-token: write

# Do not cancel an active deployment workflow.
# This is important because cancellation during deployment could
# interfere with failure handling and rollback.
concurrency:
  group: application-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-2

  ECR_REPOSITORY: demo-app
  ECR_REGISTRY: 438064565553.dkr.ecr.ap-south-2.amazonaws.com

  EKS_CLUSTER_NAME: production-eks-platform-dev

  K8S_NAMESPACE: dev
  K8S_DEPLOYMENT: demo-app
  K8S_CONTAINER: demo-app
  K8S_SERVICE: demo-app

  ROLLOUT_TIMEOUT: 5m
  HEALTHCHECK_TIMEOUT: 60s

jobs:

  # ============================================================
  # BUILD
  # ============================================================
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "BUILDING APPLICATION"
          echo "=========================================="

          IMAGE="demo-app:${GITHUB_SHA}"

          echo "Image:"
          echo "$IMAGE"

          docker build \
            -t "$IMAGE" \
            application/demo-app

          echo
          echo "Docker build successful."


  # ============================================================
  # PUSH
  # ============================================================
  push:
    name: Push Docker Image to ECR
    runs-on: ubuntu-latest

    needs:
      - build

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    outputs:
      ecr_registry: ${{ steps.ecr_login.outputs.registry }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::438064565553:role/GitHubActions-ECR-Push-Role
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "AWS IDENTITY"
          echo "=========================================="

          aws sts get-caller-identity

      - name: Login to Amazon ECR
        id: ecr_login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build ECR image
        env:
          ECR_REGISTRY: ${{ steps.ecr_login.outputs.registry }}
        run: |
          set -euo pipefail

          IMAGE="${ECR_REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}"

          echo "=========================================="
          echo "BUILDING ECR IMAGE"
          echo "=========================================="

          echo "Image:"
          echo "$IMAGE"

          docker build \
            -t "$IMAGE" \
            application/demo-app

      - name: Push image to ECR
        env:
          ECR_REGISTRY: ${{ steps.ecr_login.outputs.registry }}
        run: |
          set -euo pipefail

          IMAGE="${ECR_REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}"

          echo "=========================================="
          echo "PUSHING IMAGE TO ECR"
          echo "=========================================="

          docker push "$IMAGE"

          echo
          echo "IMAGE PUSHED SUCCESSFULLY"
          echo "$IMAGE"


  # ============================================================
  # DEPLOY
  # ============================================================
  deploy:
    name: Deploy to Amazon EKS
    runs-on: ubuntu-latest

    needs:
      - push

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    environment:
      name: development

    permissions:
      contents: read
      id-token: write

    env:
      ECR_REGISTRY: ${{ needs.push.outputs.ecr_registry }}

    steps:

      # ----------------------------------------------------------
      # CHECKOUT
      # ----------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4


      # ----------------------------------------------------------
      # AWS
      # ----------------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::438064565553:role/GitHubActions-EKS-Deploy-Role
          aws-region: ${{ env.AWS_REGION }}


      # ----------------------------------------------------------
      # KUBECTL
      # ----------------------------------------------------------
      - name: Configure kubectl
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "CONFIGURING KUBECTL"
          echo "=========================================="

          aws eks update-kubeconfig \
            --name "$EKS_CLUSTER_NAME" \
            --region "$AWS_REGION"

      - name: Verify EKS connectivity
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "EKS CONNECTIVITY"
          echo "=========================================="

          kubectl get deployment \
            "$K8S_DEPLOYMENT" \
            --namespace "$K8S_NAMESPACE"


      # ----------------------------------------------------------
      # RECORD KNOWN-GOOD DEPLOYMENT
      # ----------------------------------------------------------
      - name: Record current deployment
        id: current_deployment
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "CURRENT DEPLOYMENT"
          echo "=========================================="

          CURRENT_IMAGE="$(
            kubectl get deployment \
              "$K8S_DEPLOYMENT" \
              --namespace "$K8S_NAMESPACE" \
              -o jsonpath='{.spec.template.spec.containers[0].image}'
          )"

          CURRENT_REVISION="$(
            kubectl get deployment \
              "$K8S_DEPLOYMENT" \
              --namespace "$K8S_NAMESPACE" \
              -o jsonpath='{.metadata.annotations.deployment\.kubernetes\.io/revision}'
          )"

          CURRENT_REPLICAS="$(
            kubectl get deployment \
              "$K8S_DEPLOYMENT" \
              --namespace "$K8S_NAMESPACE" \
              -o jsonpath='{.spec.replicas}'
          )"

          if [[ -z "$CURRENT_IMAGE" ]]; then
            echo "CRITICAL: Current image could not be determined."
            exit 1
          fi

          if [[ -z "$CURRENT_REPLICAS" ]]; then
            echo "CRITICAL: Current replica count could not be determined."
            exit 1
          fi

          echo "CURRENT_IMAGE=$CURRENT_IMAGE" >> "$GITHUB_ENV"
          echo "CURRENT_REVISION=$CURRENT_REVISION" >> "$GITHUB_ENV"
          echo "CURRENT_REPLICAS=$CURRENT_REPLICAS" >> "$GITHUB_ENV"

          echo
          echo "Known-good image:"
          echo "$CURRENT_IMAGE"

          echo
          echo "Current revision:"
          echo "$CURRENT_REVISION"

          echo
          echo "Current replicas:"
          echo "$CURRENT_REPLICAS"

          echo
          echo "Rollout history:"

          kubectl rollout history \
            deployment/"$K8S_DEPLOYMENT" \
            --namespace "$K8S_NAMESPACE"


      # ----------------------------------------------------------
      # DEPLOYMENT METADATA
      # ----------------------------------------------------------
      - name: Record deployment metadata
        run: |
          set -euo pipefail

          DEPLOYMENT_TIME="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          echo "DEPLOYMENT_TIME=$DEPLOYMENT_TIME" >> "$GITHUB_ENV"

          echo "=========================================="
          echo "DEPLOYMENT METADATA"
          echo "=========================================="

          echo "Application:     $K8S_DEPLOYMENT"
          echo "Namespace:       $K8S_NAMESPACE"
          echo "Git SHA:         $GITHUB_SHA"
          echo "Repository:      $GITHUB_REPOSITORY"
          echo "Run ID:          $GITHUB_RUN_ID"
          echo "Run Number:      $GITHUB_RUN_NUMBER"
          echo "Deployment Time: $DEPLOYMENT_TIME"


      # ----------------------------------------------------------
      # ANNOTATION
      # ----------------------------------------------------------
      - name: Annotate deployment
        run: |
          set -euo pipefail

          kubectl annotate deployment \
            "$K8S_DEPLOYMENT" \
            --namespace "$K8S_NAMESPACE" \
            "deployment.git.sha=$GITHUB_SHA" \
            "deployment.run.id=$GITHUB_RUN_ID" \
            "deployment.run.number=$GITHUB_RUN_NUMBER" \
            "deployment.time=$DEPLOYMENT_TIME" \
            --overwrite

          echo "Deployment annotation applied."


      # ----------------------------------------------------------
      # DEPLOY NEW IMAGE
      # ----------------------------------------------------------
      - name: Deploy new application version
        id: deploy
        run: |
          set -euo pipefail

          NEW_IMAGE="${ECR_REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}"

          echo "=========================================="
          echo "DEPLOYING APPLICATION"
          echo "=========================================="

          echo "Application: $K8S_DEPLOYMENT"
          echo "Namespace:   $K8S_NAMESPACE"
          echo "New image:   $NEW_IMAGE"

          echo "NEW_IMAGE=$NEW_IMAGE" >> "$GITHUB_ENV"

          kubectl set image \
            deployment/"$K8S_DEPLOYMENT" \
            "$K8S_CONTAINER=$NEW_IMAGE" \
            --namespace "$K8S_NAMESPACE"

          echo
          echo "New image applied."


      # ----------------------------------------------------------
      # ROLLOUT
      #
      # IMPORTANT:
      # continue-on-error is intentional.
      #
      # We need the workflow to continue into the rollback section
      # if the rollout fails.
      # ----------------------------------------------------------
      - name: Wait for rollout
        id: rollout
        continue-on-error: true
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "WAITING FOR ROLLOUT"
          echo "=========================================="

          kubectl rollout status \
            deployment/"$K8S_DEPLOYMENT" \
            --namespace "$K8S_NAMESPACE" \
            --timeout="$ROLLOUT_TIMEOUT"


      # ----------------------------------------------------------
      # DEPLOYMENT HEALTH
      # ----------------------------------------------------------
      - name: Validate deployment health
        id: deployment_health
        continue-on-error: true
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "DEPLOYMENT HEALTH VALIDATION"
          echo "=========================================="

          DESIRED="$(
            kubectl get deployment \
              "$K8S_DEPLOYMENT" \
              --namespace "$K8S_NAMESPACE" \
              -o jsonpath='{.spec.replicas}'
          )"

          READY="$(
            kubectl get deployment \
              "$K8S_DEPLOYMENT" \
              --namespace "$K8S_NAMESPACE" \
              -o jsonpath='{.status.readyReplicas}'
          )"

          AVAILABLE="$(
            kubectl get deployment \
              "$K8S_DEPLOYMENT" \
              --namespace "$K8S_NAMESPACE" \
              -o jsonpath='{.status.availableReplicas}'
          )"

          DESIRED="${DESIRED:-0}"
          READY="${READY:-0}"
          AVAILABLE="${AVAILABLE:-0}"

          echo "Desired replicas:   $DESIRED"
          echo "Ready replicas:     $READY"
          echo "Available replicas: $AVAILABLE"

          if [[ "$READY" -ne "$DESIRED" ]]; then
            echo "ERROR: Ready replicas do not match desired replicas."
            exit 1
          fi

          if [[ "$AVAILABLE" -ne "$DESIRED" ]]; then
            echo "ERROR: Available replicas do not match desired replicas."
            exit 1
          fi

          echo
          echo "Deployment health validation passed."


      # ----------------------------------------------------------
      # POD HEALTH
      # ----------------------------------------------------------
      - name: Validate application pods
        id: pod_health
        continue-on-error: true
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "POD VALIDATION"
          echo "=========================================="

          PODS="$(
            kubectl get pods \
              --namespace "$K8S_NAMESPACE" \
              -l "app.kubernetes.io/name=$K8S_DEPLOYMENT" \
              -o json
          )"

            POD_COUNT="$(
              printf '%s' "$PODS" |
              wc -l |
              tr -d ' '
            )"

          DESIRED_REPLICAS="$(
            kubectl get deployment \
              "$K8S_DEPLOYMENT" \
              --namespace "$K8S_NAMESPACE" \
              -o jsonpath='{.spec.replicas}'
          )"

          echo "Pod count:       $POD_COUNT"
          echo "Desired replicas: $DESIRED_REPLICAS"

          if [[ "$POD_COUNT" -ne "$DESIRED_REPLICAS" ]]; then
            echo "ERROR: Pod count does not match desired replicas."
            exit 1
          fi

            NOT_READY="$(
              printf '%s' "$PODS" |
              python3 -c '
              import json
              import sys

              data = json.load(sys.stdin)

              for pod in data.get("items", []):
                  name = pod["metadata"]["name"]
                  phase = pod.get("status", {}).get("phase", "")
                  conditions = pod.get("status", {}).get("conditions", [])

                  ready = any(
                      c.get("type") == "Ready" and c.get("status") == "True"
                      for c in conditions
                  )

                  if phase != "Running" or not ready:
                      print(f"{name}|phase={phase}|ready={ready}")
              '
            )"

          if [[ -n "$NOT_READY" ]]; then
            echo "ERROR: One or more pods are not Running and Ready."
            echo "$NOT_READY"
            exit 1
          fi

          kubectl get pods \
            --namespace "$K8S_NAMESPACE" \
            -l "app.kubernetes.io/name=$K8S_DEPLOYMENT" \
            -o wide

          echo
          echo "All application pods are Running and Ready."


      # ----------------------------------------------------------
      # IMAGE VALIDATION
      # ----------------------------------------------------------
      - name: Validate deployed image
        id: image_health
        continue-on-error: true
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "IMAGE VALIDATION"
          echo "=========================================="

          DEPLOYED_IMAGE="$(
            kubectl get deployment \
              "$K8S_DEPLOYMENT" \
              --namespace "$K8S_NAMESPACE" \
              -o jsonpath='{.spec.template.spec.containers[0].image}'
          )"

          echo "Expected image:"
          echo "$NEW_IMAGE"

          echo
          echo "Deployed image:"
          echo "$DEPLOYED_IMAGE"

          if [[ "$DEPLOYED_IMAGE" != "$NEW_IMAGE" ]]; then
            echo
            echo "ERROR: Deployed image does not match expected image."
            exit 1
          fi

          echo
          echo "Image validation passed."


      # ----------------------------------------------------------
      # SERVICE ENDPOINT VALIDATION
      #
      # Use EndpointSlice JSON and Python.
      #
      # Do NOT use:
      #
      # .items[*].endpoints[?(@.conditions.ready==true)]
      #
      # because the Kubernetes JSONPath implementation on this
      # cluster did not reliably evaluate that predicate.
      # ----------------------------------------------------------
      - name: Validate service endpoints
        id: endpoint_health
        continue-on-error: true
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "SERVICE ENDPOINT VALIDATION"
          echo "=========================================="

          DESIRED_REPLICAS="$(
            kubectl get deployment \
              "$K8S_DEPLOYMENT" \
              --namespace "$K8S_NAMESPACE" \
              -o jsonpath='{.spec.replicas}'
          )"

            ENDPOINTS="$(
              kubectl get endpointslice \
                --namespace "$K8S_NAMESPACE" \
                -l "kubernetes.io/service-name=$K8S_SERVICE" \
                -o json |
              python3 -c '
              import json
              import sys

              data = json.load(sys.stdin)

              addresses = []

              for item in data.get("items", []):
                  for endpoint in item.get("endpoints", []):
                      conditions = endpoint.get("conditions", {})

                      if conditions.get("ready") is True:
                          addresses.extend(endpoint.get("addresses", []))

              for address in sorted(set(addresses)):
                  print(address)
              '
            )"

          ENDPOINT_COUNT="$(
            printf '%s\n' "$ENDPOINTS" |
              sed '/^$/d' |
              wc -l |
              tr -d ' '
          )"

          echo "Desired replicas:"
          echo "$DESIRED_REPLICAS"

          echo
          echo "Ready endpoints:"
          echo "$ENDPOINTS"

          echo
          echo "Ready endpoint count:"
          echo "$ENDPOINT_COUNT"

          if [[ "$ENDPOINT_COUNT" -ne "$DESIRED_REPLICAS" ]]; then
            echo
            echo "ERROR: Ready endpoint count does not match desired replicas."

            echo
            echo "===== ENDPOINT SLICES ====="

            kubectl get endpointslice \
              --namespace "$K8S_NAMESPACE" \
              -l "kubernetes.io/service-name=$K8S_SERVICE" \
              -o wide || true

            exit 1
          fi

          echo
          echo "Service endpoint validation passed."


      # ----------------------------------------------------------
      # APPLICATION HTTP HEALTH CHECK
      # ----------------------------------------------------------
      - name: Application HTTP health check
        id: http_health
        continue-on-error: true
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "APPLICATION HTTP HEALTH CHECK"
          echo "=========================================="

          HEALTHCHECK_POD="healthcheck-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          cleanup_healthcheck() {
            kubectl delete pod \
              "$HEALTHCHECK_POD" \
              --namespace "$K8S_NAMESPACE" \
              --ignore-not-found \
              >/dev/null 2>&1 || true
          }

          trap cleanup_healthcheck EXIT

          echo "Creating temporary health check pod:"
          echo "$HEALTHCHECK_POD"

          kubectl run "$HEALTHCHECK_POD" \
            --namespace "$K8S_NAMESPACE" \
            --image=curlimages/curl:8.10.1 \
            --restart=Never \
            --command -- \
            sh -c \
            "curl --fail --silent --show-error --max-time 10 http://${K8S_SERVICE}.${K8S_NAMESPACE}.svc.cluster.local/"

          echo
          echo "Waiting for health check pod..."

          kubectl wait \
            --namespace "$K8S_NAMESPACE" \
            --for=jsonpath='{.status.phase}'=Succeeded \
            "pod/$HEALTHCHECK_POD" \
            --timeout="$HEALTHCHECK_TIMEOUT"

          echo
          echo "Application HTTP health check passed."


      # ----------------------------------------------------------
      # SUCCESS
      #
      # This runs only when every deployment validation passed.
      # ----------------------------------------------------------
      - name: Deployment successful
        if: steps.rollout.outcome == 'success' && steps.deployment_health.outcome == 'success' && steps.pod_health.outcome == 'success' && steps.image_health.outcome == 'success' && steps.endpoint_health.outcome == 'success' && steps.http_health.outcome == 'success'
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "DEPLOYMENT SUCCESSFUL"
          echo "=========================================="

          echo "Application:    $K8S_DEPLOYMENT"
          echo "Namespace:      $K8S_NAMESPACE"
          echo "Git SHA:        $GITHUB_SHA"
          echo "Deployed image: $NEW_IMAGE"

          echo
          echo "=========================================="
          echo "DEPLOYMENT STATUS"
          echo "=========================================="

          kubectl get deployment \
            "$K8S_DEPLOYMENT" \
            --namespace "$K8S_NAMESPACE"

          echo
          echo "=========================================="
          echo "RUNNING PODS"
          echo "=========================================="

          kubectl get pods \
            --namespace "$K8S_NAMESPACE" \
            -l "app.kubernetes.io/name=$K8S_DEPLOYMENT" \
            -o wide

          echo
          echo "=========================================="
          echo "SERVICE"
          echo "=========================================="

          kubectl get service \
            "$K8S_SERVICE" \
            --namespace "$K8S_NAMESPACE"

          {
            echo "## Deployment Successful"
            echo
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Application | $K8S_DEPLOYMENT |"
            echo "| Namespace | $K8S_NAMESPACE |"
            echo "| Git SHA | $GITHUB_SHA |"
            echo "| Image | $NEW_IMAGE |"
            echo "| Desired Replicas | 3 |"
            echo "| Rollout | PASS |"
            echo "| Pods | PASS |"
            echo "| Image Validation | PASS |"
            echo "| EndpointSlice Validation | PASS |"
            echo "| HTTP Health Check | PASS |"
          } >> "$GITHUB_STEP_SUMMARY"


      # ----------------------------------------------------------
      # DIAGNOSTICS
      #
      # Run whenever one or more deployment gates fail.
      # ----------------------------------------------------------
      - name: Collect deployment diagnostics
        if: steps.rollout.outcome != 'success' || steps.deployment_health.outcome != 'success' || steps.pod_health.outcome != 'success' || steps.image_health.outcome != 'success' || steps.endpoint_health.outcome != 'success' || steps.http_health.outcome != 'success'
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "DEPLOYMENT DIAGNOSTICS"
          echo "=========================================="

          echo
          echo "===== DEPLOYMENT ====="

          kubectl describe deployment \
            "$K8S_DEPLOYMENT" \
            --namespace "$K8S_NAMESPACE" || true

          echo
          echo "===== PODS ====="

          kubectl get pods \
            --namespace "$K8S_NAMESPACE" \
            -l "app.kubernetes.io/name=$K8S_DEPLOYMENT" \
            -o wide || true

          echo
          echo "===== POD DESCRIPTIONS ====="

          kubectl describe pods \
            --namespace "$K8S_NAMESPACE" \
            -l "app.kubernetes.io/name=$K8S_DEPLOYMENT" || true

          echo
          echo "===== POD LOGS ====="

          kubectl logs \
            --namespace "$K8S_NAMESPACE" \
            -l "app.kubernetes.io/name=$K8S_DEPLOYMENT" \
            --all-containers=true \
            --tail=100 \
            --prefix || true

          echo
          echo "===== SERVICE ====="

          kubectl describe service \
            "$K8S_SERVICE" \
            --namespace "$K8S_NAMESPACE" || true

          echo
          echo "===== ENDPOINT SLICES ====="

          kubectl get endpointslice \
            --namespace "$K8S_NAMESPACE" \
            -l "kubernetes.io/service-name=$K8S_SERVICE" \
            -o wide || true


      # ============================================================
      # AUTOMATIC ROLLBACK
      # ============================================================
      - name: Rollback failed deployment
        if: steps.rollout.outcome != 'success' || steps.deployment_health.outcome != 'success' || steps.pod_health.outcome != 'success' || steps.image_health.outcome != 'success' || steps.endpoint_health.outcome != 'success' || steps.http_health.outcome != 'success'
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "DEPLOYMENT FAILED"
          echo "STARTING AUTOMATIC ROLLBACK"
          echo "=========================================="

          echo
          echo "Failed image:"
          echo "$NEW_IMAGE"

          echo
          echo "Known-good image:"
          echo "$CURRENT_IMAGE"

          # --------------------------------------------------------
          # RESTORE PREVIOUS IMAGE
          # --------------------------------------------------------
          echo
          echo "=========================================="
          echo "RESTORING PREVIOUS IMAGE"
          echo "=========================================="

          kubectl set image \
            deployment/"$K8S_DEPLOYMENT" \
            "$K8S_CONTAINER=$CURRENT_IMAGE" \
            --namespace "$K8S_NAMESPACE"

          echo
          echo "Previous image applied."


          # --------------------------------------------------------
          # WAIT FOR ROLLBACK
          # --------------------------------------------------------
          echo
          echo "=========================================="
          echo "WAITING FOR ROLLBACK"
          echo "=========================================="

          if ! kubectl rollout status \
            deployment/"$K8S_DEPLOYMENT" \
            --namespace "$K8S_NAMESPACE" \
            --timeout="$ROLLOUT_TIMEOUT"; then

            echo
            echo "=========================================="
            echo "CRITICAL: ROLLBACK FAILED"
            echo "=========================================="

            kubectl get deployment \
              "$K8S_DEPLOYMENT" \
              --namespace "$K8S_NAMESPACE" \
              -o wide || true

            kubectl get pods \
              --namespace "$K8S_NAMESPACE" \
              -l "app.kubernetes.io/name=$K8S_DEPLOYMENT" \
              -o wide || true

            exit 1
          fi


          # --------------------------------------------------------
          # ROLLBACK IMAGE + REPLICA VALIDATION
          # --------------------------------------------------------
          ROLLBACK_IMAGE="$(
            kubectl get deployment \
              "$K8S_DEPLOYMENT" \
              --namespace "$K8S_NAMESPACE" \
              -o jsonpath='{.spec.template.spec.containers[0].image}'
          )"

          DESIRED_REPLICAS="$(
            kubectl get deployment \
              "$K8S_DEPLOYMENT" \
              --namespace "$K8S_NAMESPACE" \
              -o jsonpath='{.spec.replicas}'
          )"

          READY_REPLICAS="$(
            kubectl get deployment \
              "$K8S_DEPLOYMENT" \
              --namespace "$K8S_NAMESPACE" \
              -o jsonpath='{.status.readyReplicas}'
          )"

          AVAILABLE_REPLICAS="$(
            kubectl get deployment \
              "$K8S_DEPLOYMENT" \
              --namespace "$K8S_NAMESPACE" \
              -o jsonpath='{.status.availableReplicas}'
          )"

          READY_REPLICAS="${READY_REPLICAS:-0}"
          AVAILABLE_REPLICAS="${AVAILABLE_REPLICAS:-0}"

          echo
          echo "=========================================="
          echo "ROLLBACK VALIDATION"
          echo "=========================================="

          echo "Expected image:"
          echo "$CURRENT_IMAGE"

          echo
          echo "Restored image:"
          echo "$ROLLBACK_IMAGE"

          echo
          echo "Desired replicas:   $DESIRED_REPLICAS"
          echo "Ready replicas:     $READY_REPLICAS"
          echo "Available replicas: $AVAILABLE_REPLICAS"

          if [[ "$ROLLBACK_IMAGE" != "$CURRENT_IMAGE" ]]; then
            echo
            echo "CRITICAL: Rollback restored the wrong image."
            exit 1
          fi

          if [[ "$READY_REPLICAS" -ne "$DESIRED_REPLICAS" ]]; then
            echo
            echo "CRITICAL: Rollback did not restore all ready replicas."
            exit 1
          fi

          if [[ "$AVAILABLE_REPLICAS" -ne "$DESIRED_REPLICAS" ]]; then
            echo
            echo "CRITICAL: Rollback did not restore all available replicas."
            exit 1
          fi

          echo
          echo "Rollback image and replica validation passed."


          # --------------------------------------------------------
          # POST-ROLLBACK ENDPOINTSLICE VALIDATION
          #
          # Require ready endpoint count to equal desired replicas.
          # --------------------------------------------------------
          echo
          echo "=========================================="
          echo "POST-ROLLBACK ENDPOINT VALIDATION"
          echo "=========================================="

          ENDPOINT_RETRY_ATTEMPTS=30
          ENDPOINT_RETRY_INTERVAL=2

          ROLLBACK_ENDPOINTS=""
          ROLLBACK_ENDPOINT_COUNT=0

          echo "Waiting for ready EndpointSlice endpoints..."
          echo "Maximum wait: $((ENDPOINT_RETRY_ATTEMPTS * ENDPOINT_RETRY_INTERVAL)) seconds"

          for attempt in $(seq 1 "$ENDPOINT_RETRY_ATTEMPTS"); do

          ROLLBACK_ENDPOINTS="$(
            kubectl get endpointslice \
              --namespace "$K8S_NAMESPACE" \
              -l "kubernetes.io/service-name=$K8S_SERVICE" \
              -o json |
            python3 -c '
            import json
            import sys

            data = json.load(sys.stdin)

            addresses = []

            for item in data.get("items", []):
                for endpoint in item.get("endpoints", []):
                    conditions = endpoint.get("conditions", {})

                    if conditions.get("ready") is True:
                        addresses.extend(endpoint.get("addresses", []))

            for address in sorted(set(addresses)):
                print(address)
            '
          )"

            ROLLBACK_ENDPOINT_COUNT="$(
              printf '%s\n' "$ROLLBACK_ENDPOINTS" |
                sed '/^$/d' |
                wc -l |
                tr -d ' '
            )"

            echo "Attempt $attempt/$ENDPOINT_RETRY_ATTEMPTS - Ready endpoints: $ROLLBACK_ENDPOINT_COUNT/$DESIRED_REPLICAS"

            if [[ "$ROLLBACK_ENDPOINT_COUNT" -eq "$DESIRED_REPLICAS" ]]; then
              break
            fi

            if [[ "$attempt" -lt "$ENDPOINT_RETRY_ATTEMPTS" ]]; then
              sleep "$ENDPOINT_RETRY_INTERVAL"
            fi
          done

          echo
          echo "Ready endpoint count:"
          echo "$ROLLBACK_ENDPOINT_COUNT"

          if [[ "$ROLLBACK_ENDPOINT_COUNT" -ne "$DESIRED_REPLICAS" ]]; then

            echo
            echo "CRITICAL: Ready EndpointSlice endpoint count does not match desired replicas."

            echo
            echo "===== ENDPOINT SLICES ====="

            kubectl get endpointslice \
              --namespace "$K8S_NAMESPACE" \
              -l "kubernetes.io/service-name=$K8S_SERVICE" \
              -o wide || true

            echo
            echo "===== ENDPOINT SLICES JSON ====="

            kubectl get endpointslice \
              --namespace "$K8S_NAMESPACE" \
              -l "kubernetes.io/service-name=$K8S_SERVICE" \
              -o json || true

            echo
            echo "===== SERVICE ====="

            kubectl describe service \
              "$K8S_SERVICE" \
              --namespace "$K8S_NAMESPACE" || true

            exit 1
          fi

          echo
          echo "Ready endpoints:"
          echo "$ROLLBACK_ENDPOINTS"

          echo
          echo "Post-rollback EndpointSlice validation passed."


          # --------------------------------------------------------
          # POST-ROLLBACK HTTP HEALTH CHECK
          # --------------------------------------------------------
          echo
          echo "=========================================="
          echo "POST-ROLLBACK HTTP HEALTH CHECK"
          echo "=========================================="

          ROLLBACK_HEALTHCHECK_POD="rollback-healthcheck-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          cleanup_rollback_healthcheck() {
            kubectl delete pod \
              "$ROLLBACK_HEALTHCHECK_POD" \
              --namespace "$K8S_NAMESPACE" \
              --ignore-not-found \
              >/dev/null 2>&1 || true
          }

          trap cleanup_rollback_healthcheck EXIT

          echo "Creating temporary rollback health check pod:"
          echo "$ROLLBACK_HEALTHCHECK_POD"

          kubectl run "$ROLLBACK_HEALTHCHECK_POD" \
            --namespace "$K8S_NAMESPACE" \
            --image=curlimages/curl:8.10.1 \
            --restart=Never \
            --command -- \
            sh -c \
            "curl --fail --silent --show-error --max-time 10 http://${K8S_SERVICE}.${K8S_NAMESPACE}.svc.cluster.local/"

          echo
          echo "Waiting for rollback health check pod..."

          if ! kubectl wait \
            --namespace "$K8S_NAMESPACE" \
            --for=jsonpath='{.status.phase}'=Succeeded \
            "pod/$ROLLBACK_HEALTHCHECK_POD" \
            --timeout="$HEALTHCHECK_TIMEOUT"; then

            echo
            echo "=========================================="
            echo "CRITICAL: POST-ROLLBACK HTTP HEALTH FAILED"
            echo "=========================================="

            echo
            echo "Health check pod:"
            kubectl get pod \
              "$ROLLBACK_HEALTHCHECK_POD" \
              --namespace "$K8S_NAMESPACE" \
              -o wide || true

            echo
            echo "Health check pod logs:"
            kubectl logs \
              "$ROLLBACK_HEALTHCHECK_POD" \
              --namespace "$K8S_NAMESPACE" || true

            exit 1
          fi

          echo
          echo "Post-rollback HTTP health check passed."


          # --------------------------------------------------------
          # ROLLBACK SUCCESS
          # --------------------------------------------------------
          echo
          echo "=========================================="
          echo "ROLLBACK SUCCESSFUL"
          echo "=========================================="

          echo
          echo "Previous image restored:"
          echo "$CURRENT_IMAGE"

          echo
          echo "Application is healthy after rollback."

          {
            echo "## Deployment Failed — Rollback Successful"
            echo
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Application | $K8S_DEPLOYMENT |"
            echo "| Namespace | $K8S_NAMESPACE |"
            echo "| Failed Git SHA | $GITHUB_SHA |"
            echo "| Failed Image | $NEW_IMAGE |"
            echo "| Restored Image | $CURRENT_IMAGE |"
            echo "| Desired Replicas | $DESIRED_REPLICAS |"
            echo "| Ready Replicas | $READY_REPLICAS |"
            echo "| Available Replicas | $AVAILABLE_REPLICAS |"
            echo "| Ready Endpoint Count | $ROLLBACK_ENDPOINT_COUNT |"
            echo "| Post-Rollback HTTP | PASS |"
            echo "| Rollback | SUCCESSFUL |"
            echo
            echo "> The failed application version was automatically rolled back."
            echo "> The Kubernetes deployment is healthy on the known-good image."
            echo "> The workflow remains FAILED intentionally."
          } >> "$GITHUB_STEP_SUMMARY"

          echo
          echo "The Kubernetes application has been restored."
          echo "The deployment workflow will remain FAILED intentionally."

          # IMPORTANT:
          # A rollback is operationally successful, but the CI/CD run
          # must remain FAILED because the new application version failed.
          exit 1
