name: Application CI

on:
  push:
    branches:
      - main
    paths:
      - "application/demo-app/**"
      - "kubernetes/applications/demo-app/**"
      - ".github/workflows/application-ci.yml"

  pull_request:
    branches:
      - main
    paths:
      - "application/demo-app/**"
      - "kubernetes/applications/demo-app/**"
      - ".github/workflows/application-ci.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: application-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-2

  ECR_REPOSITORY: demo-app

  EKS_CLUSTER_NAME: production-eks-platform-dev

  K8S_NAMESPACE: dev
  K8S_DEPLOYMENT: demo-app
  K8S_CONTAINER: demo-app
  K8S_SERVICE: demo-app

  ROLLOUT_TIMEOUT: 5m
  HEALTHCHECK_TIMEOUT: 60s

jobs:

  # ==========================================================
  # BUILD
  # ==========================================================
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate application port
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "APPLICATION PORT VALIDATION"
          echo "=========================================="

          EXPECTED_PORT="8080"

          NGINX_PORT="$(
            grep -oE "listen [0-9]+" \
              application/demo-app/Dockerfile |
            head -1 |
            awk '{print $2}'
          )"

          if [[ -z "$NGINX_PORT" ]]; then
            echo "ERROR: Could not determine nginx listen port."
            exit 1
          fi

          echo "Expected nginx port: $EXPECTED_PORT"
          echo "Detected nginx port: $NGINX_PORT"

          if [[ "$NGINX_PORT" != "$EXPECTED_PORT" ]]; then
            echo
            echo "ERROR: Application port mismatch."
            echo "Expected: $EXPECTED_PORT"
            echo "Detected: $NGINX_PORT"
            exit 1
          fi

          echo
          echo "Application port validation passed."

      - name: Build Docker image
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "BUILDING APPLICATION IMAGE"
          echo "=========================================="

          IMAGE="demo-app:${GITHUB_SHA}"
          IMAGE_TAR="demo-app-${GITHUB_SHA}.tar"

          echo "Docker image:"
          echo "$IMAGE"

          docker build --tag "$IMAGE" application/demo-app

          echo
          echo "Docker build completed successfully."

          echo
          echo "Saving Docker image as artifact..."

          docker save "$IMAGE" --output "$IMAGE_TAR"

          echo
          echo "Docker image artifact:"
          ls -lh "$IMAGE_TAR"

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: demo-app-image-${{ github.sha }}
          path: demo-app-${{ github.sha }}.tar
          if-no-files-found: error
          retention-days: 1


  push:
    name: Push Docker Image to ECR
    runs-on: ubuntu-latest
    needs: build

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    outputs:
      ecr_registry: ${{ steps.login-ecr.outputs.registry }}
      image: ${{ steps.image.outputs.image }}
      image_digest: ${{ steps.push-image.outputs.image_digest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials for ECR
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::438064565553:role/GitHubActions-ECR-Push-Role
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "AWS IDENTITY"
          echo "=========================================="

          aws sts get-caller-identity

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Define image
        id: image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          set -euo pipefail

          IMAGE="${ECR_REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}"

          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

          echo "=========================================="
          echo "IMAGE"
          echo "=========================================="

          echo "$IMAGE"

      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: demo-app-image-${{ github.sha }}
          path: .

      - name: Load Docker image
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "LOADING BUILT IMAGE"
          echo "=========================================="

          SOURCE_IMAGE="demo-app:${GITHUB_SHA}"
          IMAGE_TAR="demo-app-${GITHUB_SHA}.tar"

          echo "Image artifact:"
          echo "$IMAGE_TAR"

          test -f "$IMAGE_TAR"

          echo
          echo "Loading Docker image..."

          docker load \
            --input "$IMAGE_TAR"

          echo
          echo "Verifying loaded image..."

          test -n "$(
            docker image inspect \
              "$SOURCE_IMAGE" \
              --format '{{.Id}}'
          )"

          IMAGE_ID="$(
            docker image inspect \
              "$SOURCE_IMAGE" \
              --format '{{.Id}}'
          )"

          echo "Source image:"
          echo "$SOURCE_IMAGE"

          echo "Image ID:"
          echo "$IMAGE_ID"

          echo
          echo "Loaded image verification passed."

          echo "=========================================="
          echo "TAGGING IMAGE FOR ECR"
          echo "=========================================="

          docker tag "$SOURCE_IMAGE" "$IMAGE"

          echo "Source image:"
          echo "$SOURCE_IMAGE"

          echo
          echo "ECR image:"
          echo "$IMAGE"

      - name: Push image to ECR
        id: push-image
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "PUSHING IMAGE TO ECR"
          echo "=========================================="

          docker push "$IMAGE"

          echo
          echo "Image pushed successfully:"
          echo "$IMAGE"

          echo
          echo "=========================================="
          echo "RESOLVING ECR IMAGE DIGEST"
          echo "=========================================="

          IMAGE_DIGEST="$(
            aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids "imageTag=${GITHUB_SHA}" --region "$AWS_REGION" --query 'imageDetails[0].imageDigest' --output text
          )"

          if [[ -z "$IMAGE_DIGEST" || "$IMAGE_DIGEST" == "None" ]]; then
            echo
            echo "ERROR: Could not determine ECR image digest."
            exit 1
          fi

          if [[ ! "$IMAGE_DIGEST" =~ ^sha256:[0-9a-fA-F]{64}$ ]]; then
            echo
            echo "ERROR: Invalid ECR image digest:"
            echo "$IMAGE_DIGEST"
            exit 1
          fi

          echo "ECR image digest:"
          echo "$IMAGE_DIGEST"

          echo "image_digest=$IMAGE_DIGEST" >> "$GITHUB_OUTPUT"

          echo
          echo "ECR image digest validation passed."



  # ==========================================================
  # DEPLOY TO EKS
  # ==========================================================
  # ==========================================================
  # UPDATE GITOPS
  # ==========================================================
  gitops-update:
    name: Update GitOps Image
    runs-on: ubuntu-latest
    needs: push

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: write

    env:
      NEW_IMAGE: ${{ needs.push.outputs.image }}

    steps:

      # ======================================================
      # CHECKOUT
      # ======================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0


      # ======================================================
      # UPDATE GITOPS IMAGE
      # ======================================================
      - name: Update development GitOps image
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "UPDATING GITOPS IMAGE"
          echo "=========================================="

          GITOPS_FILE="gitops/apps/demo-app/dev/values.yaml"

          test -f "$GITOPS_FILE"

          NEW_TAG="${GITHUB_SHA}"

          echo "Git SHA:"
          echo "$NEW_TAG"

          echo
          echo "GitOps file:"
          echo "$GITOPS_FILE"

          OLD_TAG="$(
            sed -n 's/^[[:space:]]*tag:[[:space:]]*"\([^"]*\)".*/\1/p' "$GITOPS_FILE" |
              head -1
          )"

          if [[ -z "$OLD_TAG" ]]; then
            echo
            echo "ERROR: Could not determine existing GitOps image tag."
            exit 1
          fi

          echo
          echo "Previous GitOps tag:"
          echo "$OLD_TAG"

          echo
          echo "New GitOps tag:"
          echo "$NEW_TAG"

          if [[ "$OLD_TAG" == "$NEW_TAG" ]]; then
            echo
            echo "GitOps already references this Git SHA."
            exit 0
          fi

          sed -i \
            "0,/^[[:space:]]*tag:[[:space:]]*\"[^\"]*\"/s//  tag: \"${NEW_TAG}\"/" \
            "$GITOPS_FILE"

          echo
          echo "Updated GitOps image:"
          grep -n -A2 '^image:' "$GITOPS_FILE"


      # ======================================================
      # HELM VALIDATION
      # ======================================================
      - name: Validate GitOps Helm configuration
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "VALIDATING GITOPS HELM CONFIGURATION"
          echo "=========================================="

          helm lint helm/demo-app

          helm template demo-app \
            helm/demo-app \
            --namespace dev \
            -f gitops/apps/demo-app/dev/values.yaml \
            > /tmp/demo-app-gitops-rendered.yaml

          test -s /tmp/demo-app-gitops-rendered.yaml

          echo
          echo "Rendered image:"
          grep -n 'image:' /tmp/demo-app-gitops-rendered.yaml

          echo
          echo "Rendered replica count:"
          grep -n 'replicas:' /tmp/demo-app-gitops-rendered.yaml

          echo
          echo "GitOps Helm validation passed."


      # ======================================================
      # KUBERNETES MANIFEST VALIDATION
      # ======================================================
      - name: Validate rendered Kubernetes manifests
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "VALIDATING KUBERNETES MANIFESTS"
          echo "=========================================="

          kubectl apply \
            --dry-run=client \
            -f /tmp/demo-app-gitops-rendered.yaml

          echo
          echo "Kubernetes manifest validation passed."


      # ======================================================
      # GIT DIFF
      # ======================================================
      - name: Verify GitOps change
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "GITOPS CHANGE"
          echo "=========================================="

          git diff --check

          echo
          git diff -- gitops/apps/demo-app/dev/values.yaml

          if git diff --quiet -- gitops/apps/demo-app/dev/values.yaml; then
            echo
            echo "No GitOps change detected."
            exit 1
          fi

          echo
          echo "GitOps change validation passed."


      # ======================================================
      # COMMIT
      # ======================================================
      - name: Commit GitOps update
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "COMMITTING GITOPS UPDATE"
          echo "=========================================="

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add gitops/apps/demo-app/dev/values.yaml

          git diff --cached --check

          git commit \
            -m "ci(gitops): deploy demo-app ${GITHUB_SHA}"

          echo
          echo "GitOps commit created:"
          git log -1 --oneline


      # ======================================================
      # PUSH
      # ======================================================
      - name: Push GitOps update
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "PUSHING GITOPS UPDATE"
          echo "=========================================="

          git push origin HEAD:main

          echo
          echo "GitOps update pushed successfully."

          echo
          echo "Argo CD will reconcile the new desired state."
