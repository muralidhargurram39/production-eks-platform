name: Application CI

on:
  push:
    branches:
      - main
    paths:
      - "application/demo-app/**"
      - ".github/workflows/application-ci.yml"

  pull_request:
    branches:
      - main
    paths:
      - "application/demo-app/**"
      - ".github/workflows/application-ci.yml"

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-south-2
  ECR_REPOSITORY: demo-app

jobs:

  oidc-debug:
    name: OIDC Token Claims
    runs-on: ubuntu-latest

    steps:
      - name: Display GitHub context
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Ref: $GITHUB_REF"
          echo "Event: $GITHUB_EVENT_NAME"
          echo "Workflow: $GITHUB_WORKFLOW"

      - name: Display OIDC token claims
        shell: bash
        run: |
          set -euo pipefail

          TOKEN="$(curl -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" \
            | jq -r '.value')"

          PAYLOAD="$(echo "$TOKEN" | cut -d '.' -f2)"

          echo "$PAYLOAD" | base64 -d 2>/dev/null \
            || echo "$PAYLOAD" | base64 --decode

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -t demo-app:${{ github.sha }} \
            application/demo-app

  push:
    name: Push Docker Image to ECR
    runs-on: ubuntu-latest
    needs:
      - oidc-debug
      - build

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::438064565553:role/GitHubActions-ECR-Push-Role
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image for ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build \
            -t "$ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:${{ github.sha }}" \
            -t "$ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:latest" \
            application/demo-app

      - name: Push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker push \
            "$ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:${{ github.sha }}"

          docker push \
            "$ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:latest"
# Trigger Application CI after OIDC subject fix
