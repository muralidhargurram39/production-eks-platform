name: Application CI

on:
  push:
    branches:
      - main
    paths:
      - "application/demo-app/**"
      - "kubernetes/applications/demo-app/**"
      - ".github/workflows/application-ci.yml"

  pull_request:
    branches:
      - main
    paths:
      - "application/demo-app/**"
      - "kubernetes/applications/demo-app/**"
      - ".github/workflows/application-ci.yml"

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-south-2
  ECR_REPOSITORY: demo-app
  EKS_CLUSTER_NAME: production-eks-platform-dev
  KUBERNETES_NAMESPACE: dev
  APPLICATION_NAME: demo-app

jobs:

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          set -euo pipefail

          docker build \
            -t demo-app:${{ github.sha }} \
            application/demo-app


  push:
    name: Push Docker Image to ECR
    runs-on: ubuntu-latest
    needs: build

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials for ECR
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::438064565553:role/GitHubActions-ECR-Push-Role
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "AWS IDENTITY - ECR ROLE"
          echo "=========================================="

          aws sts get-caller-identity

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image for ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          set -euo pipefail

          docker build \
            -t $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:${{ github.sha }} \
            -t $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:latest \
            application/demo-app

      - name: Push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          set -euo pipefail

          docker push \
            $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

          docker push \
            $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:latest

      - name: Show pushed image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          echo "=========================================="
          echo "IMAGE PUSHED SUCCESSFULLY"
          echo "=========================================="

          echo "Immutable image:"
          echo "$ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:${{ github.sha }}"

          echo
          echo "Latest image:"
          echo "$ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:latest"


  deploy:
    name: Deploy to Amazon EKS
    runs-on: ubuntu-latest
    needs: push

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      id-token: write

    steps:
     - name: Checkout repository
       uses: actions/checkout@v4

     - name: Configure AWS credentials for EKS
       uses: aws-actions/configure-aws-credentials@v4
       with:
        role-to-assume: arn:aws:iam::438064565553:role/GitHubActions-EKS-Deploy-Role
        aws-region: ${{ env.AWS_REGION }}

     - name: Configure kubectl
       run: |
        set -euo pipefail

        aws eks update-kubeconfig \
          --name "$EKS_CLUSTER_NAME" \
          --region "$AWS_REGION"

     - name: Verify EKS connectivity
       run: |
        set -euo pipefail

        echo "=========================================="
        echo "EKS CONNECTIVITY"
        echo "=========================================="

        kubectl get deployment \
          --namespace "$K8S_NAMESPACE"

     - name: Record current deployment revision
       run: |
        set -euo pipefail

        echo "=========================================="
        echo "CURRENT DEPLOYMENT"
        echo "=========================================="

        kubectl rollout history deployment/"$K8S_DEPLOYMENT" \
          --namespace "$K8S_NAMESPACE"

        CURRENT_IMAGE=$(kubectl get deployment "$K8S_DEPLOYMENT" \
          --namespace "$K8S_NAMESPACE" \
          -o jsonpath='{.spec.template.spec.containers[0].image}')

        echo "CURRENT_IMAGE=$CURRENT_IMAGE" >> "$GITHUB_ENV"

        echo "Current image:"
        echo "$CURRENT_IMAGE"

     - name: Deploy new application version
       id: deploy
       run: |
        set -euo pipefail

        echo "=========================================="
        echo "DEPLOYING APPLICATION"
        echo "=========================================="

        NEW_IMAGE="${ECR_REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}"

        echo "Application: $K8S_DEPLOYMENT"
        echo "Namespace: $K8S_NAMESPACE"
        echo "Image: $NEW_IMAGE"

        kubectl set image \
          deployment/"$K8S_DEPLOYMENT" \
          "$K8S_CONTAINER=$NEW_IMAGE" \
          --namespace "$K8S_NAMESPACE"

     - name: Wait for rollout
       id: rollout
       run: |
        set -euo pipefail

        echo "=========================================="
        echo "WAITING FOR ROLLOUT"
        echo "=========================================="

        kubectl rollout status \
          deployment/"$K8S_DEPLOYMENT" \
          --namespace "$K8S_NAMESPACE" \
          --timeout=5m

     - name: Rollback on deployment failure
       if: failure()
       run: |
        echo "=========================================="
        echo "DEPLOYMENT FAILED"
        echo "STARTING AUTOMATIC ROLLBACK"
        echo "=========================================="

        kubectl rollout undo \
          deployment/"$K8S_DEPLOYMENT" \
          --namespace "$K8S_NAMESPACE"

        echo "=========================================="
        echo "WAITING FOR ROLLBACK"
        echo "=========================================="

        kubectl rollout status \
          deployment/"$K8S_DEPLOYMENT" \
          --namespace "$K8S_NAMESPACE" \
          --timeout=5m

        echo "=========================================="
        echo "ROLLBACK COMPLETED"
        echo "=========================================="

        kubectl get deployment \
          "$K8S_DEPLOYMENT" \
          --namespace "$K8S_NAMESPACE" \
          -o wide

     - name: Verify deployment
       if: success()
       run: |
        set -euo pipefail

        echo "=========================================="
        echo "DEPLOYMENT STATUS"
        echo "=========================================="

        kubectl get deployment \
          "$K8S_DEPLOYMENT" \
          --namespace "$K8S_NAMESPACE" \
          -o wide

        echo
        echo "=========================================="
        echo "RUNNING PODS"
        echo "=========================================="

        kubectl get pods \
          --namespace "$K8S_NAMESPACE" \
          -l app.kubernetes.io/name=demo-app \
          -o wide

        echo
        echo "=========================================="
        echo "DEPLOYED IMAGE"
        echo "=========================================="

        kubectl get deployment \
          "$K8S_DEPLOYMENT" \
          --namespace "$K8S_NAMESPACE" \
          -o jsonpath='{.spec.template.spec.containers[0].image}'

        echo
